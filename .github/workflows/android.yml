name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      # מספר הגרסה עולה אוטומטית בכל בנייה: 1.0.3, 1.0.4 ...
      APP_VERSION: 1.0.${{ github.run_number }}
      APK_NAME: TomchuTattoo-v1.0.${{ github.run_number }}.apk
      AAB_NAME: TomchuTattoo-v1.0.${{ github.run_number }}-unsigned.aab
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Prepare web files
        run: npm run build:web

      # באנדרואיד Capacitor מזריק סקריפט גישור קטן לתוך הדף, ולכן שם מתירים סקריפט פנימי (עדיין בלי סקריפטים מאתרים זרים)
      - name: CSP for the Android WebView
        run: sed -i "s#script-src 'self' https://cdn.onesignal.com#script-src 'self' 'unsafe-inline'#" www/index.html && grep -o "script-src[^;]*" www/index.html

      - name: Create Android project
        run: npx cap add android

      # הקשחת אבטחה: בלי גיבוי/העתקת נתונים מהמכשיר, רק חיבורים מוצפנים, ובלי הרשאות מיותרות
      - name: Harden Android manifest
        working-directory: android/app/src/main
        run: |
          mkdir -p res/xml
          cat > res/xml/network_security_config.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <network-security-config>
            <base-config cleartextTrafficPermitted="false">
              <trust-anchors><certificates src="system" /></trust-anchors>
            </base-config>
          </network-security-config>
          EOF
          cat > res/xml/data_extraction_rules.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <data-extraction-rules>
            <cloud-backup><exclude domain="root" /><exclude domain="file" /><exclude domain="database" /><exclude domain="sharedpref" /><exclude domain="external" /></cloud-backup>
            <device-transfer><exclude domain="root" /><exclude domain="file" /><exclude domain="database" /><exclude domain="sharedpref" /><exclude domain="external" /></device-transfer>
          </data-extraction-rules>
          EOF
          cat > res/xml/backup_rules.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <full-backup-content>
            <exclude domain="root" path="." /><exclude domain="file" path="." /><exclude domain="database" path="." /><exclude domain="sharedpref" path="." /><exclude domain="external" path="." />
          </full-backup-content>
          EOF
          python3 - <<'PY'
          import re
          p='AndroidManifest.xml'; s=open(p).read()
          if 'xmlns:tools=' not in s:
              s=s.replace('xmlns:android="http://schemas.android.com/apk/res/android"','xmlns:android="http://schemas.android.com/apk/res/android" xmlns:tools="http://schemas.android.com/tools"',1)
          s=re.sub(r'android:allowBackup="[^"]*"','',s)
          s=s.replace('<application','<application android:allowBackup="false" android:fullBackupContent="@xml/backup_rules" android:dataExtractionRules="@xml/data_extraction_rules" android:usesCleartextTraffic="false" android:networkSecurityConfig="@xml/network_security_config" tools:replace="android:allowBackup"',1)
          perms=['android.permission.ACCESS_FINE_LOCATION','android.permission.ACCESS_COARSE_LOCATION','android.permission.ACCESS_BACKGROUND_LOCATION','com.google.android.gms.permission.AD_ID','android.permission.READ_PHONE_STATE','android.permission.CAMERA','android.permission.RECORD_AUDIO','android.permission.READ_EXTERNAL_STORAGE','android.permission.WRITE_EXTERNAL_STORAGE','android.permission.SYSTEM_ALERT_WINDOW']
          block=''.join('    <uses-permission android:name="%s" tools:node="remove" />\n'%x for x in perms)
          s=s.replace('</manifest>',block+'</manifest>',1)
          open(p,'w').write(s)
          PY
          cat AndroidManifest.xml

      - name: Icons and splash
        run: >
          npx @capacitor/assets generate --android --assetPath resources
          --iconBackgroundColor '#0B0A0D' --iconBackgroundColorDark '#0B0A0D'
          --splashBackgroundColor '#0B0A0D' --splashBackgroundColorDark '#0B0A0D'

      - name: Sync
        run: npx cap sync android

      - name: Set version number
        working-directory: android
        run: |
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"$APP_VERSION\"/" app/build.gradle
          grep -E "versionCode|versionName" app/build.gradle

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug bundleRelease --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/$APK_NAME"
          cp app/build/outputs/bundle/release/app-release.aab "$GITHUB_WORKSPACE/$AAB_NAME"
          grep -E "targetSdkVersion|compileSdkVersion" variables.gradle
          echo "--- הרשאות סופיות באפליקציה ---"
          grep -ho 'uses-permission[^>]*android:name="[^"]*"' app/build/intermediates/merged_manifests/release/*/AndroidManifest.xml app/build/intermediates/merged_manifest/release/*/AndroidManifest.xml 2>/dev/null | sort -u || true
          grep -ho 'android:allowBackup="[^"]*"\|android:usesCleartextTraffic="[^"]*"\|android:debuggable="[^"]*"' app/build/intermediates/merged_manifest*/release/*/AndroidManifest.xml 2>/dev/null | sort -u || true

      # חתימה על ה-AAB עם מפתח ההעלאה ל-Google Play (מתוך הסודות של GitHub).
      # אם הסודות עוד לא הוגדרו – מדלגים, ונשאר רק הקובץ הלא חתום.
      - name: Sign AAB for Google Play
        env:
          UPLOAD_KEYSTORE_B64: ${{ secrets.UPLOAD_KEYSTORE_B64 }}
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$UPLOAD_KEYSTORE_B64" ] || [ -z "$UPLOAD_KEYSTORE_PASSWORD" ]; then
            echo "No upload key secrets yet – skipping signed AAB"
            exit 0
          fi
          echo "$UPLOAD_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          SIGNED="TomchuTattoo-v$APP_VERSION.aab"
          cp "$AAB_NAME" "$SIGNED"
          jarsigner -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore "$RUNNER_TEMP/upload.jks" \
            -storepass:env UPLOAD_KEYSTORE_PASSWORD -keypass:env UPLOAD_KEYSTORE_PASSWORD \
            "$SIGNED" tomchu-upload
          jarsigner -verify "$SIGNED" | tail -1
          rm -f "$RUNNER_TEMP/upload.jks" "$AAB_NAME"
          echo "AAB_NAME=$SIGNED" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: TomchuTattoo-v${{ env.APP_VERSION }}
          path: |
            ${{ env.APK_NAME }}
            ${{ env.AAB_NAME }}

      - name: Publish to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$APP_VERSION" "$APK_NAME" "$AAB_NAME" \
            --title "Tomchu Tattoo v$APP_VERSION" \
            --notes "להורדה בטלפון: לוחצים על $APK_NAME, מאשרים התקנה ממקור לא ידוע, ומתקינים מעל הגרסה הקיימת. קובץ ה־AAB מיועד ל־Google Play." \
            --latest

      # מעלה את ה־AAB החתום לענף play-upload, כדי ש־Play Console יוכל למשוך אותו ישירות (בלי לצרף קבצים)
      - name: Publish signed AAB for Play upload
        if: ${{ endsWith(env.AAB_NAME, format('v{0}.aab', env.APP_VERSION)) }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/play" && cd "$RUNNER_TEMP/play"
          cp "$GITHUB_WORKSPACE/$AAB_NAME" .
          cp "$GITHUB_WORKSPACE/assets/icons/icon-512.png" store-icon-512.png
          printf '{"version":"%s","aab":"%s","commit":"%s"}\n' "$APP_VERSION" "$AAB_NAME" "$GITHUB_SHA" > latest.json
          git init -q -b play-upload
          git add .
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -q -m "Play upload v$APP_VERSION"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" play-upload
