name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      # מספר הגרסה עולה אוטומטית בכל בנייה: 1.0.3, 1.0.4 ...
      APP_VERSION: 1.0.${{ github.run_number }}
      APK_NAME: TomchuTattoo-v1.0.${{ github.run_number }}.apk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Prepare web files
        run: npm run build:web

      - name: Create Android project
        run: npx cap add android

      - name: Icons and splash
        run: >
          npx @capacitor/assets generate --android --assetPath resources
          --iconBackgroundColor '#0B0A0D' --iconBackgroundColorDark '#0B0A0D'
          --splashBackgroundColor '#0B0A0D' --splashBackgroundColorDark '#0B0A0D'

      - name: Sync
        run: npx cap sync android

      - name: Set version number
        working-directory: android
        run: |
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"$APP_VERSION\"/" app/build.gradle
          grep -E "versionCode|versionName" app/build.gradle

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/$APK_NAME"

      - uses: actions/upload-artifact@v4
        with:
          name: TomchuTattoo-v${{ env.APP_VERSION }}
          path: ${{ env.APK_NAME }}

      - name: Publish to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$APP_VERSION" "$APK_NAME" \
            --title "Tomchu Tattoo v$APP_VERSION" \
            --notes "להורדה בטלפון: לוחצים על $APK_NAME, מאשרים התקנה ממקור לא ידוע, ומתקינים מעל הגרסה הקיימת." \
            --latest
