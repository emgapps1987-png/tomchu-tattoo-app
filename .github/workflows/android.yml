name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      # מספר הגרסה עולה אוטומטית בכל בנייה: 1.0.3, 1.0.4 ...
      APP_VERSION: 1.0.${{ github.run_number }}
      APK_NAME: TomchuTattoo-v1.0.${{ github.run_number }}.apk
      AAB_NAME: TomchuTattoo-v1.0.${{ github.run_number }}-unsigned.aab
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Prepare web files
        run: npm run build:web

      - name: Create Android project
        run: npx cap add android

      - name: Icons and splash
        run: >
          npx @capacitor/assets generate --android --assetPath resources
          --iconBackgroundColor '#0B0A0D' --iconBackgroundColorDark '#0B0A0D'
          --splashBackgroundColor '#0B0A0D' --splashBackgroundColorDark '#0B0A0D'

      - name: Sync
        run: npx cap sync android

      - name: Set version number
        working-directory: android
        run: |
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"$APP_VERSION\"/" app/build.gradle
          grep -E "versionCode|versionName" app/build.gradle

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug bundleRelease --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/$APK_NAME"
          cp app/build/outputs/bundle/release/app-release.aab "$GITHUB_WORKSPACE/$AAB_NAME"
          grep -E "targetSdkVersion|compileSdkVersion" variables.gradle

      # חתימה על ה-AAB עם מפתח ההעלאה ל-Google Play (מתוך הסודות של GitHub).
      # אם הסודות עוד לא הוגדרו – מדלגים, ונשאר רק הקובץ הלא חתום.
      - name: Sign AAB for Google Play
        env:
          UPLOAD_KEYSTORE_B64: ${{ secrets.UPLOAD_KEYSTORE_B64 }}
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$UPLOAD_KEYSTORE_B64" ] || [ -z "$UPLOAD_KEYSTORE_PASSWORD" ]; then
            echo "No upload key secrets yet – skipping signed AAB"
            exit 0
          fi
          echo "$UPLOAD_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          SIGNED="TomchuTattoo-v$APP_VERSION.aab"
          cp "$AAB_NAME" "$SIGNED"
          jarsigner -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore "$RUNNER_TEMP/upload.jks" \
            -storepass:env UPLOAD_KEYSTORE_PASSWORD -keypass:env UPLOAD_KEYSTORE_PASSWORD \
            "$SIGNED" tomchu-upload
          jarsigner -verify "$SIGNED" | tail -1
          rm -f "$RUNNER_TEMP/upload.jks" "$AAB_NAME"
          echo "AAB_NAME=$SIGNED" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: TomchuTattoo-v${{ env.APP_VERSION }}
          path: |
            ${{ env.APK_NAME }}
            ${{ env.AAB_NAME }}

      - name: Publish to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$APP_VERSION" "$APK_NAME" "$AAB_NAME" \
            --title "Tomchu Tattoo v$APP_VERSION" \
            --notes "להורדה בטלפון: לוחצים על $APK_NAME, מאשרים התקנה ממקור לא ידוע, ומתקינים מעל הגרסה הקיימת. קובץ ה־AAB מיועד ל־Google Play." \
            --latest
