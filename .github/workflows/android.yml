name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Prepare web files
        run: npm run build:web

      - name: Create Android project
        run: npx cap add android

      - name: Icons and splash
        run: >
          npx @capacitor/assets generate --android --assetPath resources
          --iconBackgroundColor '#0B0A0D' --iconBackgroundColorDark '#0B0A0D'
          --splashBackgroundColor '#0B0A0D' --splashBackgroundColorDark '#0B0A0D'

      - name: Sync
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/TomchuTattoo.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: TomchuTattoo-apk
          path: TomchuTattoo.apk

      - name: Publish to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" TomchuTattoo.apk \
            --title "Tomchu Tattoo – גרסת בדיקה ${{ github.run_number }}" \
            --notes "להורדה בטלפון: לוחצים על TomchuTattoo.apk, מאשרים התקנה ממקור לא ידוע, ומתקינים." \
            --latest
